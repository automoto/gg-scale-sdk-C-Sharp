# Minimal stack for SDK integration tests: postgres + ggscale-server.
# The server image applies its embedded migrations at startup, so no
# separate migrate container is needed; scripts/integration-test.sh
# seeds the tenant/project/API keys directly via psql once the server
# reports healthy (healthy ⇒ migrations done).
#
# Identical to the Go SDK's stack except for the compose project name
# and host port, so both suites can run side by side.
name: ggscale-cs-it

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ggscale
      POSTGRES_PASSWORD: ggscale
      POSTGRES_DB: ggscale
    volumes:
      - ./seed.sql:/seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ggscale -d ggscale"]
      interval: 2s
      timeout: 3s
      retries: 30

  ggscale:
    # Pinned to an immutable release tag so contract tests can't silently
    # drift against a moving `latest`. Override with GGSCALE_IMAGE. Party
    # queue is on by default from v0.9.68, so no party setting is needed.
    image: ${GGSCALE_IMAGE:-ghcr.io/automoto/gg-scale:v0.9.71}
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://ggscale:ggscale@postgres:5432/ggscale?sslmode=disable
      CACHE_BACKEND: memory
      HTTP_ADDR: ":8080"
      LOG_LEVEL: info
      # ENV=dev skips the production cross-validation (CORS, secure
      # cookies, digest pinning) that would refuse to boot this stack.
      ENV: dev
      # No mail flow is exercised by the tests; noop avoids a mailhog
      # container. The control panel is likewise not under test.
      MAIL_PROVIDER: noop
      CONTROL_PANEL_DISABLED: "true"
      # The same TURN relay settings as the Go SDK's stack. There is no real
      # TURN server; the advertised URI is intentionally non-routable.
      FEATURE_P2P_RELAY_ENABLED: "true"
      # Must be >= 32 bytes (server enforces this when relay is enabled).
      RELAY_SHARED_SECRET: integration-relay-shared-secret-0123456789
      RELAY_URLS: turn:relay.invalid:3478?transport=udp
    ports:
      # 18081: distinct from the dev server (8080) and the Go SDK's
      # integration stack (18080).
      - "127.0.0.1:18081:8080"
