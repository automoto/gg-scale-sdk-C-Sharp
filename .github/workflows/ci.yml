name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "true"

jobs:

  version:
    name: Tag matches version
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Compare tag with GGScale.csproj and SdkVersion
        run: |
          want="${GITHUB_REF_NAME#v}"
          grep -qF "<Version>$want</Version>" src/GGScale/GGScale.csproj ||
            { echo "::error::GGScale.csproj <Version> is not $want"; exit 1; }
          grep -qF "Value = \"$want\";" src/GGScale/SdkVersion.cs ||
            { echo "::error::SdkVersion.Value is not $want"; exit 1; }

  lint-build-test:
    name: Lint, build, and unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Lint
        run: make lint

      - name: Build
        run: make build

      - name: Unit tests
        run: make test

      - name: OpenAPI operation coverage
        run: make openapi-check

  integration:
    name: Integration tests
    needs: lint-build-test
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Integration tests (docker compose)
        run: make test-integration
